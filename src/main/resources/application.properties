upload.dir=${UPLOAD_DIR:${java.io.tmpdir}/ssm-cxf-uploads}
upload.max-bytes=10485760

# local/test 可用 PRIVACY_MASKING_ENABLED=false 查看假資料；prod 禁止關閉。
app.environment=${APP_ENVIRONMENT:local}
privacy.logging.payload-enabled=${PRIVACY_PAYLOAD_LOGGING_ENABLED:true}
privacy.logging.payload-limit=${PRIVACY_PAYLOAD_LOG_LIMIT:65536}
privacy.masking.enabled=${PRIVACY_MASKING_ENABLED:true}
privacy.masking.fail-closed=true
privacy.masking.full-keywords=密碼,password,passwd,pwd,pin,token,secret,apiKey,authorization,cookie,setCookie,sessionId,cvv,cvc,安全碼,背後三碼
privacy.masking.name-keywords=姓名,holderName,requesterName,policyHolderName,insuredName,beneficiaryName,proposerName,applicantName,要保人姓名,被保人姓名,受益人姓名
privacy.masking.phone-keywords=手機,電話,行動電話,mobile,phone,telephone,tel
privacy.masking.email-keywords=email,e-mail,電子郵件,mailAddress,emailAddress
privacy.masking.address-keywords=地址,戶籍地址,通訊地址,address,postalAddress
privacy.masking.id-keywords=身分證字號,身份證字號,identityNo,nationalId,idNo,personalId
privacy.masking.card-keywords=信用卡號,cardNumber,creditCard,pan
privacy.masking.account-keywords=帳號,accountNo,bankAccount,loginAccount,username,userId
